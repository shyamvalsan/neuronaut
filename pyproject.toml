[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronaut"
version = "0.1.0"
description = "Find single-neuron levers in small language models, see them in 3D, and test them against chance before you believe them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shyam Sreevalsan" }]
dependencies = ["torch>=2.2", "transformers>=5.0", "numpy"]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
export = ["onnx", "onnxruntime>=1.25.1"]
dev = ["pytest"]

[project.scripts]
neuronaut = "neuronaut.cli:main"

[tool.setuptools.packages.find]
include = ["neuronaut*"]

[tool.setuptools.package-data]
neuronaut = ["data/*.json", "web/**/*"]
